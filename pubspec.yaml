name: gdocente
description: "GDocente - Gestión académica simple para docentes."
publish_to: 'none'

# 1.2.0 = versión visible · +4 = número interno (debe subir en CADA actualización)
version: 1.2.1+5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.0        # Motor SQLite embebido (Android)
  path: ^1.9.0           # Construcción de rutas de archivos multiplataforma
  url_launcher: ^6.3.0   # Abrir WhatsApp mediante enlace wa.me
  excel: ^4.0.6
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Ícono propio de la app. Se genera con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/gdocente_icon.png"
  adaptive_icon_background: "#1E3A8A"
  adaptive_icon_foreground: "assets/icon/gdocente_foreground.png"
  min_sdk_android: 21
